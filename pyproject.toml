[project]
name = "reproscope"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyreadstat>=1.3.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: builds or downloads something real; deselect with -m 'not slow'"]

# Cheap-model experiment: no Sonnet, Opus, Fable or Sol escalation.
# Two separate Haiku reconstruction sessions; Luna supplies a second model family
# for visual extraction and reviews. Numerical references remain deterministic.
descriptive_readouts = true
scoped_multiverse = false
multiverse_min_active_dimensions = 5

[tiers.vision_a]
route = "claude_p"
model = "haiku"
[tiers.vision_b]
route = "openrouter"
model = "openai/gpt-5.6-luna"
[tiers.arbiter]
route = "claude_p"
model = "haiku"
[tiers.cheap]
route = "claude_p"
model = "haiku"
[tiers.mid]
route = "codex"
model = "gpt-5.6-luna"
[tiers.strong]
route = "claude_p"
model = "haiku"
[tiers.strong_alt]
route = "codex"
model = "gpt-5.6-luna"
[replicas.haiku]
route = "claude_p"
model = "haiku"
generation_mode = "tool_free"
runs = 2
[executor]
route = "claude_p"
model = "haiku"
generation_mode = "tool_free"

[shadow_prices]
"gpt-5.6-luna" = 0.2

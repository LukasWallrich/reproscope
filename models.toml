# Model configuration. Tiers name the job; routes name the client.
# route: openrouter | claude_p | codex | opencode

[tiers.vision_a]
route = "openrouter"
model = "z-ai/glm-5.3-flash"

[tiers.vision_b]
route = "openrouter"
model = "openai/gpt-5.6-luna"

[tiers.cheap]
route = "openrouter"
model = "z-ai/glm-5.3-flash"

[tiers.mid]                 # readiness and other short judgement calls
route = "claude_p"
model = "sonnet"

[tiers.strong]
route = "claude_p"
model = "opus"

[tiers.strong_alt]          # second family for the Stage 3 screen and second-opinion steps
route = "codex"
model = "gpt-5.6-sol"

# Replica lineup: family -> route/model. `runs` is per family.
[replicas.opus]
route = "claude_p"
model = "opus"
runs = 1

[replicas.fable]
route = "claude_p"
model = "claude-fable-5-1"
runs = 1

[replicas.luna]
route = "codex"
model = "gpt-5.6-luna"
runs = 2

[replicas.glm]
route = "opencode"
model = "z-ai/glm-5.3-flash"
runs = 2

[replicas.deepseek]
route = "opencode"
model = "deepseek/deepseek-v4-flash"
runs = 2

[executor]                  # Stage 3 multiverse execution
route = "opencode"
model = "z-ai/glm-5.3-flash"


# USD per million tokens for routes that report no price (codex). Codex reports one
# token total, almost all of it input, so the input list price is used as the rate.
# OpenAI list prices as of 2026-08-21 (Sol promotional rate through at least
# 2026-11-21): Sol 4.00 in / 20.00 out; Luna 0.20 in / 1.20 out.
[shadow_prices]
"gpt-5.6-sol" = 4.0
"gpt-5.6-luna" = 0.2
